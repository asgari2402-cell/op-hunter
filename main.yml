name: OP Hunter Scan & Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  push:
    branches: ["main"]
    paths-ignore:
      - "data/results.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: op-hunter-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offizielle Neuerscheinungen synchronisieren
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python update_products.py

      - name: Shops prüfen
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scanner.py

      - name: Neue Ergebnisse speichern
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "OP Hunter Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json data/products.json data/events.json data/price_history.json
          git diff --cached --quiet || git commit -m "Automatische Bestandsprüfung"
          git push

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
